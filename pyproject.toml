[build-system]
requires = ["setuptools>=45", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "isopro"
version = "0.3.2"
description = "Intelligent Simulation Orchestration for Large Language Models"
readme = "README.md"
authors = [{name = "Jazmia Henry", email = "isojaz@isoai.co"}]
license = {text = "Apache License 2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["LLM", "AI", "simulation", "reinforcement-learning", "adversarial-attacks", "NLP", "workflow-automation", "computer-vision"]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "opencv-python>=4.5.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "ultralytics>=8.0.0",
    "pillow>=9.0.0",
    "stable-baselines3>=2.0.0",
    "scikit-learn>=1.0.0",
    "transformers",
    "sentence-transformers",
    "langchain",
    "langchain_openai",
    "isozero>=0.1.0",
    "iso-adverse",
    "anthropic>=0.3.0",
    "openai",
    "nltk",
    "rouge",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.65.0",
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.10",
    "gunicorn>=20.1.0",
    "werkzeug>=2.0.0",
    "ortools",
]

[project.urls]
Homepage = "https://github.com/iso-ai/isopro"
"Bug Tracker" = "https://github.com/iso-ai/isopro/tree/main/.github/ISSUE_TEMPLATE.md"
Documentation = "https://github.com/yourusername/isopro/wiki"
Examples = "https://github.com/iso-ai/isopro_examples/tree/main/examples"
